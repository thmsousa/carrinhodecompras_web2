<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro de Pessoa Física')}"></head>
<body class="bg-light">
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container pb-5 animate-fade-in">
    <div class="row">
        <div class="col-lg-8 mx-auto">

            <!-- Cabeçalho do formulário -->
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h3 class="fw-bold m-0 text-dark">Nova Pessoa Física (Admin)</h3>
                    <p class="text-muted small m-0">Preencha os dados cadastrais do cliente PF</p>
                </div>
                <a th:href="@{/clientes/lista}" class="btn btn-secondary-custom py-2 px-3 d-inline-flex align-items-center gap-1">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
            </div>

            <!-- Card de Cadastro -->
            <div class="card card-premium shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/clientes/save-pf}" th:object="${pessoaFisica}" method="post">

                        <!-- Nome -->
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Nome Completo</label>
                            <div class="input-group">
                                <span class="input-group-text input-group-text-custom">
                                    <i class="bi bi-person text-muted"></i>
                                </span>
                                <input type="text" th:field="*{nome}"
                                       class="form-control form-control-custom ps-2"
                                       placeholder="Ex: João da Silva"
                                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                       style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                                <div class="invalid-feedback" th:errors="*{nome}"></div>
                            </div>
                        </div>

                        <!-- CPF e Telefone -->
                        <div class="row mb-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">CPF</label>
                                <div class="input-group">
                                    <span class="input-group-text input-group-text-custom">
                                        <i class="bi bi-card-text text-muted"></i>
                                    </span>
                                    <input type="text" th:field="*{cpf}"
                                           class="form-control form-control-custom ps-2"
                                           placeholder="000.000.000-00"
                                           th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"
                                           style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                                    <div class="invalid-feedback" th:errors="*{cpf}"></div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Telefone</label>
                                <div class="input-group">
                                    <span class="input-group-text input-group-text-custom">
                                        <i class="bi bi-telephone text-muted"></i>
                                    </span>
                                    <input type="text" th:field="*{telefone}"
                                           class="form-control form-control-custom ps-2"
                                           placeholder="(00) 00000-0000"
                                           th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'"
                                           style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                                    <div class="invalid-feedback" th:errors="*{telefone}"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Endereço de E-mail</label>
                            <div class="input-group">
                                <span class="input-group-text input-group-text-custom">
                                    <i class="bi bi-envelope text-muted"></i>
                                </span>
                                <input type="email" th:field="*{email}"
                                       class="form-control form-control-custom ps-2"
                                       placeholder="joao@exemplo.com"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                       style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>
                        </div>

                        <!-- Endereço Section -->
                        <hr class="my-4">
                        <p class="small fw-bold text-success text-uppercase mb-3"><i class="bi bi-geo-alt-fill me-1"></i> Endereço Residencial de Entrega</p>

                        <!-- Rótulo -->
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Rótulo / Identificação do Endereço</label>
                            <div class="input-group">
                                <span class="input-group-text input-group-text-custom"><i class="bi bi-tag text-muted"></i></span>
                                <input type="text" th:field="*{enderecos[0].rotulo}" class="form-control form-control-custom ps-2" placeholder="Ex: Residencial, Trabalho, Casa do Pai" required style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                            </div>
                        </div>

                        <!-- Logradouro e Número -->
                        <div class="row mb-4">
                            <div class="col-md-9 mb-3 mb-md-0">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Logradouro / Rua</label>
                                <div class="input-group">
                                    <span class="input-group-text input-group-text-custom"><i class="bi bi-signpost text-muted"></i></span>
                                    <input type="text" th:field="*{enderecos[0].logradouro}" class="form-control form-control-custom ps-2" placeholder="Ex: Avenida Tocantins" required style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Número</label>
                                <input type="text" th:field="*{enderecos[0].numero}" class="form-control form-control-custom" placeholder="Ex: 12" required>
                            </div>
                        </div>

                        <!-- Bairro e Complemento -->
                        <div class="row mb-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Bairro</label>
                                <input type="text" th:field="*{enderecos[0].bairro}" class="form-control form-control-custom" placeholder="Ex: Centro" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Complemento</label>
                                <input type="text" th:field="*{enderecos[0].complemento}" class="form-control form-control-custom" placeholder="Ex: Apto 204">
                            </div>
                        </div>

                        <!-- Cidade e CEP -->
                        <div class="row mb-4">
                            <div class="col-md-7 mb-3 mb-md-0">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Cidade</label>
                                <div class="input-group">
                                    <span class="input-group-text input-group-text-custom"><i class="bi bi-map text-muted"></i></span>
                                    <input type="text" th:field="*{enderecos[0].cidade}" class="form-control form-control-custom ps-2" placeholder="Ex: Palmas" required style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                                </div>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">CEP</label>
                                <input type="text" th:field="*{enderecos[0].cep}" class="form-control form-control-custom" placeholder="77000-000" required>
                            </div>
                        </div>

                        <!-- Ações -->
                        <div class="d-flex gap-2 justify-content-end border-top pt-4 mt-4">
                            <a th:href="@{/clientes/lista}" class="btn btn-secondary-custom px-4 py-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary-custom px-4 py-2">
                                <i class="bi bi-check-circle-fill me-1"></i> Salvar Cliente
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
