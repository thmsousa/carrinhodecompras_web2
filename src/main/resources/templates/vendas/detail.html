<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes da Venda')}"></head>
<body class="bg-light">
<header th:replace="~{fragments/layout :: header}"></header>

<div class="container pb-5">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h2 class="fw-bold m-0 text-dark">
                Venda <span class="text-success" th:text="'#' + ${venda.id}"></span>
            </h2>
            <p class="text-muted small m-0">Detalhamento completo dos itens e do cliente associado a esta transação</p>
        </div>
        <a th:href="@{/vendas/lista}" class="btn btn-secondary-custom py-2 px-3 d-inline-flex align-items-center gap-1">
            <i class="bi bi-arrow-left"></i> Voltar ao Histórico
        </a>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card card-premium h-100">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4 border-bottom pb-3">
                        <i class="bi bi-person-circle text-success me-2"></i>
                        Informações do Cliente
                    </h5>

                    <div class="mb-4">
                        <small class="small text-muted text-uppercase fw-bold d-block mb-1" style="font-size: 0.65rem; letter-spacing: 0.5px;">Nome / Razão Social</small>
                        <span class="fw-bold text-dark fs-5" th:text="${venda.cliente.nomeExibicao}"></span>
                    </div>

                    <div class="mb-4">
                        <small class="small text-muted text-uppercase fw-bold d-block mb-1" style="font-size: 0.65rem; letter-spacing: 0.5px;">Tipo de Documento</small>
                        <div>
                            <span class="badge badge-custom mb-2"
                                  th:classappend="${venda.cliente.tipoDocumentoLabel == 'PF'} ? 'badge-pf' : 'badge-pj'"
                                  th:text="${venda.cliente.tipoDocumentoLabel == 'PF'} ? 'Pessoa Física' : 'Pessoa Jurídica'">
                            </span>
                            <div class="text-dark fw-bold small mt-1" th:text="${venda.cliente.numeroDocumento}"></div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <small class="small text-muted text-uppercase fw-bold d-block mb-1" style="font-size: 0.65rem; letter-spacing: 0.5px;">Telefone de Contato</small>
                        <span class="text-dark fw-semibold small">
                            <i class="bi bi-telephone text-muted me-1"></i>
                            <span th:text="${venda.cliente.telefone != null and !venda.cliente.telefone.empty} ? ${venda.cliente.telefone} : 'Não informado'"></span>
                        </span>
                    </div>

                    <div class="mt-4 p-3 bg-light rounded-4 border-start border-success border-4 shadow-sm">
                        <small class="small text-muted text-uppercase fw-bold d-block mb-1" style="font-size: 0.65rem; letter-spacing: 0.5px;">Data e Hora da Compra</small>
                        <span class="text-dark fw-bold" th:text="${#temporals.format(venda.data, 'dd/MM/yyyy HH:mm')}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card card-premium overflow-hidden h-100">
                <div class="card-header bg-white border-0 pt-4 px-4 pb-2">
                    <h5 class="fw-bold m-0">
                        <i class="bi bi-list-stars text-success me-2"></i>
                        Itens Adquiridos
                    </h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-custom align-middle">
                            <thead>
                            <tr>
                                <th class="ps-4">Produto</th>
                                <th class="text-center" style="width: 100px;">Qtd</th>
                                <th>Unitário</th>
                                <th class="pe-4 text-end" style="width: 150px;">Subtotal</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${venda.itens}">
                                <td class="ps-4">
                                    <span class="fw-bold text-dark d-block" th:text="${item.produto.descricao}"></span>
                                    <small class="text-muted" th:text="'ID: #' + ${item.produto.id}"></small>
                                </td>
                                <td class="text-center fw-bold text-dark" th:text="${item.quantidade}"></td>
                                <td th:text="'R$ ' + ${#numbers.formatDecimal(item.produto.valor, 1, 'POINT', 2, 'COMMA')}"></td>
                                <td class="pe-4 fw-bold text-success text-end fs-5" th:text="'R$ ' + ${#numbers.formatDecimal(item.total(), 1, 'POINT', 2, 'COMMA')}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card-footer bg-white border-top border-light p-4">
                    <div class="d-flex justify-content-end align-items-center">
                        <div class="text-end py-2 px-3 rounded-4 bg-light shadow-sm">
                            <small class="text-muted text-uppercase fw-bold d-block mb-1" style="font-size: 0.65rem; letter-spacing: 0.5px;">Valor Total Final</small>
                            <span class="h2 fw-bold text-danger m-0" th:text="'R$ ' + ${#numbers.formatDecimal(venda.total(), 1, 'POINT', 2, 'COMMA')}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
