<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meu Carrinho')}"></head>
<body class="bg-light">
<header th:replace="~{fragments/layout :: header}"></header>

<div class="container pb-5">
    <div th:if="${mensagemErro}" class="alert alert-premium alert-danger border-0 shadow-sm mb-4 d-flex align-items-center">
        <div class="bg-danger rounded-circle p-2 me-3 d-flex align-items-center justify-content-center shadow-sm" style="width: 40px; height: 40px;">
            <i class="bi bi-exclamation-triangle-fill text-white fs-5"></i>
        </div>
        <div>
            <strong class="d-block text-danger small text-uppercase fw-bold">Erro de Validação</strong>
            <span class="text-dark small" th:text="${mensagemErro}"></span>
        </div>
    </div>

    <div th:if="${mensagemSucesso}" class="alert alert-premium alert-success border-0 shadow-sm mb-4 d-flex align-items-center">
        <div class="bg-success rounded-circle p-2 me-3 d-flex align-items-center justify-content-center shadow-sm" style="width: 40px; height: 40px;">
            <i class="bi bi-info-circle-fill text-white fs-5"></i>
        </div>
        <div class="flex-grow-1">
            <strong class="d-block text-success small text-uppercase fw-bold">Carrinho</strong>
            <span class="text-dark small" th:text="${mensagemSucesso}"></span>
        </div>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card card-premium overflow-hidden mb-4" style="border-radius: var(--radius-lg);">
                <div class="card-header bg-white border-0 py-3 px-4 d-flex align-items-center justify-content-between">
                    <h4 class="fw-bold m-0 text-dark">Itens no Carrinho</h4>
                    <span class="badge bg-light text-muted border px-2 py-1" th:text="${venda != null ? #lists.size(venda.itens) : 0} + ' item(ns)'"></span>
                </div>

                <div class="card-body p-0 text-center py-5" th:if="${venda == null or venda.itens.isEmpty()}">
                    <i class="bi bi-cart-x display-1 text-muted opacity-25 d-block mb-3"></i>
                    <h5 class="fw-bold text-dark">Seu carrinho está vazio</h5>
                    <p class="small text-muted mb-4">Adicione produtos do catálogo para finalizar uma venda.</p>
                    <a th:href="@{/produtos/lista}" class="btn btn-primary-custom rounded-pill px-4 shadow-none">
                        Ver Catálogo de Produtos
                    </a>
                </div>

                <div th:if="${venda != null and !venda.itens.isEmpty()}" class="table-responsive">
                    <table class="table table-custom align-middle">
                        <thead>
                        <tr>
                            <th class="ps-4">Produto</th>
                            <th class="text-center" style="width: 150px;">Quantidade</th>
                            <th>Subtotal</th>
                            <th class="text-center" style="width: 80px;">Remover</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item, stat : ${venda.itens}">
                            <td class="ps-4">
                                <span class="fw-bold text-dark d-block" th:text="${item.produto.descricao}"></span>
                                <small class="text-muted" th:text="'Unitário: R$ ' + ${#numbers.formatDecimal(item.produto.valor, 1, 'POINT', 2, 'COMMA')}"></small>
                            </td>
                            <td class="text-center">
                                <form th:action="@{/vendas/atualizar-quantidade}" method="post">
                                    <input type="hidden" name="index" th:value="${stat.index}">
                                    <div class="product-quantity-selector d-inline-flex align-items-center shadow-sm">
                                        <button type="button" class="btn-qty" onclick="var input = this.parentNode.querySelector('input[type=number]'); if(input.value > 1) { input.stepDown(); input.form.submit(); }">-</button>
                                        <input type="number" name="novaQuantidade" th:value="${item.quantidade}" min="1"
                                               onchange="this.form.submit()" class="fw-bold text-center border-0 bg-transparent" style="width: 50px;">
                                        <button type="button" class="btn-qty" onclick="var input = this.parentNode.querySelector('input[type=number]'); input.stepUp(); input.form.submit();">+</button>
                                    </div>
                                </form>
                            </td>
                            <td>
                                <span class="fw-bold text-success fs-5" th:text="'R$ ' + ${#numbers.formatDecimal(item.total(), 1, 'POINT', 2, 'COMMA')}"></span>
                            </td>
                            <td class="text-center">
                                <form th:action="@{/vendas/remover-item}" method="post">
                                    <input type="hidden" name="index" th:value="${stat.index}">
                                    <button type="submit" class="btn btn-outline-danger btn-sm border-0 rounded-circle p-2" title="Remover item">
                                        <i class="bi bi-trash fs-5"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card checkout-card bg-success text-white border-0 p-4 rounded-4">
                <div class="card-body">
                    <h4 class="fw-bold mb-4">Resumo da Compra</h4>

                    <div class="mb-4 text-center py-4 bg-white bg-opacity-10 rounded-4">
                        <small class="d-block text-uppercase fw-bold mb-1" style="font-size: 0.7rem; color: rgba(255,255,255,0.75);">Valor Total</small>
                        <h1 class="display-6 fw-bold mb-0 text-white" th:text="'R$ ' + ${#numbers.formatDecimal(venda != null ? venda.total() : 0, 1, 'POINT', 2, 'COMMA')}"></h1>
                    </div>

                    <form th:action="@{/vendas/finalizar}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase mb-2 text-white">Endereço de Entrega</label>
                            <select name="enderecoId" class="form-select border-0 shadow-sm py-2 px-3 text-dark rounded-3" required>
                                <option value="" disabled selected>Escolha onde entregar...</option>
                                <option th:each="end : ${enderecos}" th:value="${end.id}"
                                        th:text="'[' + ${end.rotulo} + '] ' + ${end.logradouro} + ', nº ' + ${end.numero}"></option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-uppercase mb-2 text-white">Forma de Pagamento</label>
                            <select name="formaPagamento" class="form-select border-0 shadow-sm py-2 px-3 text-dark rounded-3" required>
                                <option value="" disabled selected>Forma de pagamento...</option>
                                <option value="Pix">Pix</option>
                                <option value="Cartão de Crédito">Cartão de Crédito</option>
                                <option value="Cartão de Débito">Cartão de Débito</option>
                                <option value="Boleto Bancário">Boleto Bancário</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-light btn-lg w-100 fw-bold text-success shadow py-3 rounded-pill border-0 d-flex align-items-center justify-content-center gap-2"
                                th:disabled="${venda == null or venda.itens.isEmpty()}">
                            <i class="bi bi-check-lg fs-4"></i>
                            <span>FINALIZAR COMPRA</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
