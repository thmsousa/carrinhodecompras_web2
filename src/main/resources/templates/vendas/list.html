<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Histórico de Vendas')}"></head>
<body class="bg-light">
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container pb-5">
    <!-- Mensagem de Sucesso -->
    <div th:if="${mensagemSucesso}" class="alert alert-premium alert-success border-0 shadow-sm mb-4 d-flex align-items-center">
        <div class="bg-success rounded-circle p-2 me-3 d-flex align-items-center justify-content-center shadow-sm" style="width: 40px; height: 40px;">
            <i class="bi bi-check-lg text-white fs-5"></i>
        </div>
        <div class="flex-grow-1">
            <strong class="d-block text-success small text-uppercase fw-bold">Sucesso</strong>
            <span class="text-dark small" th:text="${mensagemSucesso}"></span>
        </div>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Cabeçalho & Filtro -->
    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">
        <div>
            <h2 class="fw-bold m-0 text-dark">
                <i class="bi bi-receipt text-success me-2"></i>
                Histórico de Vendas
            </h2>
            <p class="text-muted small m-0">Consulte todas as transações realizadas no sistema</p>
        </div>

        <form th:action="@{/vendas/lista}" method="get" class="d-flex gap-2 align-items-center flex-wrap">
            <span class="small fw-bold text-muted text-uppercase me-1 d-none d-sm-inline">Filtrar:</span>
            <div class="d-flex align-items-center bg-white border rounded-pill px-3 py-1 shadow-sm">
                <i class="bi bi-calendar-event text-muted me-2"></i>
                <input type="date" name="dataFiltro" class="form-control border-0 bg-transparent shadow-none p-1" th:value="${param.dataFiltro}" style="font-size: 0.85rem; width: 140px;">
            </div>
            <button type="submit" class="btn btn-primary-custom py-2 px-3" style="box-shadow: none; border-radius: var(--radius-full); font-size: 0.85rem;">
                Buscar
            </button>
            <a th:href="@{/vendas/lista}" class="btn btn-secondary-custom py-2 px-3" style="border-radius: var(--radius-full); font-size: 0.85rem;">
                Limpar
            </a>
        </form>
    </div>

    <!-- Tabela de Transações -->
    <div class="table-custom-container">
        <div class="table-responsive">
            <table class="table table-custom align-middle">
                <thead>
                    <tr>
                        <th style="width: 100px;" class="text-center">ID</th>
                        <th>Data e Hora</th>
                        <th>Cliente</th>
                        <th>Total da Compra</th>
                        <th class="text-center" style="width: 150px;">Ação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${vendas}">
                        <td class="text-center">
                            <span class="badge bg-light text-muted border px-2 py-1" th:text="'#' + ${v.id}"></span>
                        </td>
                        <td class="fw-medium text-dark" th:text="${#temporals.format(v.data, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="bg-light rounded-circle d-flex align-items-center justify-content-center text-muted" style="width: 32px; height: 32px;">
                                    <i class="bi bi-person"></i>
                                </div>
                                <span class="fw-bold text-dark" th:text="${v.cliente != null ? v.cliente.nomeExibicao : 'Cliente Não Identificado'}"></span>
                            </div>
                        </td>
                        <td>
                            <span class="fw-bold text-success fs-5" th:text="'R$ ' + ${#numbers.formatDecimal(v.total(), 1, 'POINT', 2, 'COMMA')}"></span>
                        </td>
                        <td class="text-center">
                            <a class="btn btn-white btn-sm rounded-pill px-3 fw-bold text-success border shadow-sm btn-action"
                               th:href="@{/vendas/detalhes/{id}(id=${v.id})}">
                                <i class="bi bi-search me-1"></i> Detalhes
                            </a>
                        </td>
                    </tr>
                    
                    <!-- Sem Vendas cadastradas -->
                    <tr th:if="${#lists.isEmpty(vendas)}">
                        <td colspan="5" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox display-4 d-block mb-3 opacity-25"></i>
                            <h5 class="fw-bold text-dark">Nenhuma venda realizada</h5>
                            <p class="small text-muted">Ainda não há registros de vendas no período selecionado.</p>
                            <a th:href="@{/produtos/lista}" class="btn btn-primary-custom rounded-pill mt-2 py-2 px-4 shadow-none">
                                Ir para o Catálogo
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
