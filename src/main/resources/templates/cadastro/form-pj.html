<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro de Pessoa Jurídica')}"></head>
<body class="bg-light">
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container pb-5">
    <div class="row">
        <div class="col-lg-8 mx-auto">

            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h3 class="fw-bold m-0 text-dark">Nova Pessoa Jurídica</h3>
                    <p class="text-muted small m-0">Preencha os dados cadastrais do cliente PJ</p>
                </div>
                <a th:href="@{/login}" class="btn btn-secondary-custom py-2 px-3 d-inline-flex align-items-center gap-1">
                    <i class="bi bi-arrow-left"></i> Voltar para Login
                </a>
            </div>

            <div class="card card-premium">
                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/cadastro/save-pj}" th:object="${pessoaJuridica}" method="post">

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Razão Social</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 border-0 ps-3">
                                    <i class="bi bi-building text-muted"></i>
                                </span>
                                <input type="text" th:field="*{razaoSocial}"
                                       class="form-control form-control-custom border-start-0 ps-2"
                                       placeholder="Ex: ACME Corporation Ltda"
                                       th:classappend="${#fields.hasErrors('razaoSocial')} ? 'is-invalid'"
                                       style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                                <div class="invalid-feedback" th:errors="*{razaoSocial}"></div>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">CNPJ</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 border-0 ps-3">
                                        <i class="bi bi-card-heading text-muted"></i>
                                    </span>
                                    <input type="text" th:field="*{cnpj}"
                                           class="form-control form-control-custom border-start-0 ps-2"
                                           placeholder="00.000.000/0000-00"
                                           th:classappend="${#fields.hasErrors('cnpj')} ? 'is-invalid'"
                                           style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                                    <div class="invalid-feedback" th:errors="*{cnpj}"></div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Telefone</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 border-0 ps-3">
                                        <i class="bi bi-telephone text-muted"></i>
                                    </span>
                                    <input type="text" th:field="*{telefone}"
                                           class="form-control form-control-custom border-start-0 ps-2"
                                           placeholder="(00) 0000-0000"
                                           th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'"
                                           style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                                    <div class="invalid-feedback" th:errors="*{telefone}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Endereço de E-mail Corporativo</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 border-0 ps-3">
                                    <i class="bi bi-envelope text-muted"></i>
                                </span>
                                <input type="email" th:field="*{email}"
                                       class="form-control form-control-custom border-start-0 ps-2"
                                       placeholder="contato@empresa.com"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                       style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>
                        </div>

                        <hr class="my-4">
                        <p class="small fw-bold text-muted text-uppercase mb-3"><i class="bi bi-geo-alt-fill text-success me-1"></i> Endereço Sede / Entrega</p>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Rótulo do Endereço (Tipo)</label>
                            <input type="text" th:field="*{enderecos[0].rotulo}" class="form-control form-control-custom" placeholder="Ex: Matriz, Filial, Depósito" required>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-9 mb-3 mb-md-0">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Logradouro / Rua</label>
                                <input type="text" th:field="*{enderecos[0].logradouro}" class="form-control form-control-custom" placeholder="Ex: Galpão Central" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Número</label>
                                <input type="text" th:field="*{enderecos[0].numero}" class="form-control form-control-custom" placeholder="Ex: 40" required>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Bairro</label>
                                <input type="text" th:field="*{enderecos[0].bairro}" class="form-control form-control-custom" placeholder="Ex: Setor Industrial" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Complemento</label>
                                <input type="text" th:field="*{enderecos[0].complemento}" class="form-control form-control-custom" placeholder="Ex: Sala 10">
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-7 mb-3 mb-md-0">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Cidade</label>
                                <input type="text" th:field="*{enderecos[0].cidade}" class="form-control form-control-custom" placeholder="Ex: Palmas" required>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">CEP</label>
                                <input type="text" th:field="*{enderecos[0].cep}" class="form-control form-control-custom" placeholder="77000-000" required>
                            </div>
                        </div>

                        <hr class="my-4">
                        <p class="small fw-bold text-muted text-uppercase mb-3"><i class="bi bi-shield-lock-fill text-muted me-1"></i> Credenciais de Acesso</p>

                        <div class="row mb-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Nome de Usuário</label>
                                <input type="text" name="loginUsuario" class="form-control form-control-custom" placeholder="Ex: empresajur" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-2">Senha de Acesso</label>
                                <input type="password" name="senhaUsuario" class="form-control form-control-custom" required>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end border-top pt-4 mt-4">
                            <a th:href="@{/login}" class="btn btn-secondary-custom px-4 py-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary-custom px-4 py-2">
                                <i class="bi bi-check-circle-fill me-1"></i> Concluir Cadastro
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
