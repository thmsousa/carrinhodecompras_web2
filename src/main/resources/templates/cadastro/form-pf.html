<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro de Pessoa Física')}"></head>
<body class="bg-light">
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container pb-5">
    <div class="row">
        <div class="col-lg-8 mx-auto">

            <div class="card card-premium">
                <div class="card-body p-4 p-md-5">

                    <!-- Cabeçalho do Card -->
                    <div class="text-center mb-4">
                        <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                            <i class="bi bi-person-plus text-success fs-3"></i>
                        </div>
                        <h3 class="fw-bold m-0 text-dark">Cadastro - Pessoa Física</h3>
                        <p class="text-muted small m-0">Preencha seus dados para criar uma conta</p>
                    </div>

                    <form th:action="@{/cadastro/save-pf}" th:object="${pessoaFisica}" method="post">

                        <!-- NOME COMPLETO -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-1">Nome Completo</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 ps-3"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" th:field="*{nome}" class="form-control form-control-custom border-start-0 ps-2" placeholder="Ex: João da Silva" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{nome}"></div>
                            </div>
                        </div>

                        <!-- CPF e TELEFONE -->
                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-1">CPF</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 ps-3"><i class="bi bi-card-text text-muted"></i></span>
                                    <input type="text" th:field="*{cpf}" class="form-control form-control-custom border-start-0 ps-2" placeholder="000.000.000-00" th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{cpf}"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-1">Telefone</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 ps-3"><i class="bi bi-telephone text-muted"></i></span>
                                    <input type="text" th:field="*{telefone}" class="form-control form-control-custom border-start-0 ps-2" placeholder="(00) 00000-0000" th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{telefone}"></div>
                                </div>
                            </div>
                        </div>

                        <!-- E-MAIL -->
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-1">E-mail</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 ps-3"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" th:field="*{email}" class="form-control form-control-custom border-start-0 ps-2" placeholder="joao@exemplo.com" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>
                        </div>

                        <!-- SEÇÃO DE ENDEREÇO (Com o estilo idêntico ao seu padrão) -->
                        <div class="border-top pt-3 mb-3">
                            <p class="small fw-bold text-success text-uppercase mb-3"><i class="bi bi-geo-alt-fill me-1"></i> Endereço de Entrega</p>
                        </div>

                        <!-- RÓTULO DO ENDEREÇO -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-1">Rótulo do Endereço</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 ps-3"><i class="bi bi-tag text-muted"></i></span>
                                <input type="text" th:field="*{enderecos[0].rotulo}" class="form-control form-control-custom border-start-0 ps-2" placeholder="Ex: Residencial, Trabalho, Casa do Pai" required>
                            </div>
                        </div>

                        <!-- LOGRADOURO E NÚMERO -->
                        <div class="row mb-3">
                            <div class="col-md-9 mb-3 mb-md-0">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-1">Rua / Logradouro</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 ps-3"><i class="bi bi-signpost text-muted"></i></span>
                                    <input type="text" th:field="*{enderecos[0].logradouro}" class="form-control form-control-custom border-start-0 ps-2" placeholder="Ex: Av. JK, Rua 15" required>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-1">Número</label>
                                <input type="text" th:field="*{enderecos[0].numero}" class="form-control form-control-custom" placeholder="Nº" required>
                            </div>
                        </div>

                        <!-- BAIRRO E COMPLEMENTO -->
                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-1">Bairro</label>
                                <input type="text" th:field="*{enderecos[0].bairro}" class="form-control form-control-custom" placeholder="Ex: Centro" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-1">Complemento</label>
                                <input type="text" th:field="*{enderecos[0].complemento}" class="form-control form-control-custom" placeholder="Ex: Apto 302">
                            </div>
                        </div>

                        <!-- CIDADE E CEP -->
                        <div class="row mb-4">
                            <div class="col-md-7 mb-3 mb-md-0">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-1">Cidade</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 ps-3"><i class="bi bi-map text-muted"></i></span>
                                    <input type="text" th:field="*{enderecos[0].cidade}" class="form-control form-control-custom border-start-0 ps-2" placeholder="Ex: Palmas" required>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-1">CEP</label>
                                <input type="text" th:field="*{enderecos[0].cep}" class="form-control form-control-custom" placeholder="00000-000" required>
                            </div>
                        </div>

                        <!-- DADOS DE ACESSO -->
                        <div class="border-top pt-3 mb-3">
                            <p class="small fw-bold text-muted text-uppercase mb-2">Dados de Acesso</p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-1">Usuário</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 ps-3"><i class="bi bi-shield-lock text-muted"></i></span>
                                <input type="text" name="loginUsuario" class="form-control form-control-custom border-start-0 ps-2" placeholder="Escolha um nome de usuário" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase mb-1">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 ps-3"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" name="senhaUsuario" class="form-control form-control-custom border-start-0 ps-2" placeholder="••••••••" required>
                            </div>
                        </div>

                        <!-- BOTÃO ENVIAR -->
                        <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold text-white rounded-pill shadow-none d-flex align-items-center justify-content-center gap-2" style="background-color: #00a86b; border: none;">
                            <i class="bi bi-check-circle"></i> Cadastrar
                        </button>

                        <div class="text-center mt-3">
                            <a th:href="@{/login}" class="text-muted small text-decoration-none">Já possui conta? Faça login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
