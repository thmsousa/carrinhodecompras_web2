<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Catálogo de Produtos')}"></head>
<body class="bg-light">
<header th:replace="~{fragments/layout :: header}"></header>

<div class="container pb-5">
    <div th:if="${mensagem}" class="position-fixed bottom-0 end-0 p-4" style="z-index: 2000;">
        <div class="alert alert-premium bg-dark text-white border-0 shadow-lg fade show d-flex align-items-center p-3 mb-0" role="alert" style="min-width: 350px;">
            <div class="bg-success rounded-circle p-2 me-3 d-flex align-items-center justify-content-center shadow-sm" style="width: 45px; height: 45px;">
                <i class="bi bi-cart-check-fill text-white fs-5"></i>
            </div>
            <div class="flex-grow-1 pe-3">
                <strong class="d-block text-success small text-uppercase fw-bold" style="letter-spacing: 1px;">Carrinho</strong>
                <span class="fw-medium text-white small" th:text="${mensagem}"></span>
            </div>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h2 class="fw-bold m-0 text-dark">Catálogo de Produtos</h2>
            <p class="text-muted small m-0">Navegue pelas opções disponíveis e monte seu carrinho de compras</p>
        </div>
        <div class="d-flex align-items-center gap-2">

            <a th:href="@{/produtos/form}" class="btn btn-secondary-custom d-inline-flex align-items-center gap-2" sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-plus-circle-fill text-success"></i> Novo Produto
            </a>

            <a th:href="@{/vendas/carrinho}" class="btn btn-primary-custom d-inline-flex align-items-center gap-2 position-relative px-4">
                <i class="bi bi-cart3"></i> Ver Carrinho
                <span th:if="${session.venda_sessao != null and !session.venda_sessao.itens.isEmpty()}"
                      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-white shadow-sm"
                      th:text="${#lists.size(session.venda_sessao.itens)}"
                      style="font-size: 0.75rem; padding: 0.4em 0.6em;">0</span>
            </a>
        </div>
    </div>

    <div class="card card-premium mb-5" style="border-radius: var(--radius-md);">
        <div class="card-body p-2 bg-white" style="border-radius: var(--radius-md);">
            <form th:action="@{/produtos/lista}" method="get" class="row g-2 align-items-center">
                <div class="col-md-9 col-sm-8">
                    <div class="input-group">
                        <span class="input-group-text border-0 bg-transparent ps-3">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" name="descricao" class="form-control border-0 bg-transparent shadow-none"
                               placeholder="O que você está procurando hoje?" th:value="${param.descricao}">
                    </div>
                </div>
                <div class="col-md-3 col-sm-4 text-end px-2">
                    <button type="submit" class="btn btn-primary-custom w-100 py-2" style="border-radius: var(--radius-md); box-shadow: none;">
                        Filtrar Produtos
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="p : ${produtos}">
            <div class="card card-premium h-100">
                <div class="img-container-premium">
                    <img th:if="${p.imagem != null and !p.imagem.empty}"
                         th:src="@{'/img/' + ${p.imagem}}"
                         th:alt="${p.descricao}">
                    <div th:unless="${p.imagem != null and !p.imagem.empty}" class="text-center py-5">
                        <i class="bi bi-image fs-1 text-muted opacity-25"></i>
                        <p class="small text-muted mt-2 mb-0">Sem imagem disponível</p>
                    </div>
                </div>

                <div class="card-body p-4 text-center d-flex flex-column justify-content-between">
                    <div>
                        <span class="badge badge-custom badge-pf mb-2">#[[${p.id}]]</span>
                        <h5 class="card-title fw-bold mb-3 text-truncate" th:text="${p.descricao}" th:title="${p.descricao}"></h5>
                    </div>

                    <div>
                        <div class="bg-light py-2 px-3 rounded-4 mb-4 d-inline-block">
                            <small class="text-muted d-block small text-uppercase fw-bold" style="font-size: 0.65rem; letter-spacing: 0.5px;">Preço Unitário</small>
                            <span class="h4 fw-bold text-success mb-0"
                                  th:text="'R$ ' + ${#numbers.formatDecimal(p.valor, 1, 'POINT', 2, 'COMMA')}"></span>
                        </div>

                        <form th:action="@{/produtos/adicionar}" method="post">
                            <input type="hidden" name="produto.id" th:value="${p.id}">
                            <div class="d-flex align-items-center gap-2">
                                <div class="product-quantity-selector d-flex align-items-center flex-grow-1">
                                    <button type="button" class="btn-qty" onclick="var input = this.parentNode.querySelector('input[type=number]'); if(input.value > 1) input.stepDown();">-</button>
                                    <input type="number" name="quantidade" value="1" min="1" class="fw-bold flex-grow-1 text-center" style="width: 50px;">
                                    <button type="button" class="btn-qty" onclick="this.parentNode.querySelector('input[type=number]').stepUp()">+</button>
                                </div>
                                <button class="btn btn-primary-custom px-3 py-2" type="submit" style="border-radius: var(--radius-md); box-shadow: none;" title="Adicionar ao carrinho">
                                    <i class="bi bi-cart-plus-fill fs-5"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12" th:if="${#lists.isEmpty(produtos)}">
            <div class="card card-premium py-5 text-center text-muted">
                <div class="card-body">
                    <i class="bi bi-box-open display-3 d-block mb-3 opacity-25"></i>
                    <h5 class="fw-bold text-dark">Nenhum produto encontrado</h5>
                    <p class="small text-muted">Não encontramos nenhum item correspondente aos critérios de pesquisa.</p>
                    <a th:href="@{/produtos/lista}" class="btn btn-secondary-custom rounded-pill mt-2">Limpar Filtro</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
